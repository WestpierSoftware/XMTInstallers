#
# Comma Delimited INI file, ignore any line beginning with # as it is a comment
# but may help in understanding the coding structure:
#
# Col 1:  Ignore, it is just a Sequence Number for human quick reference to the various 386 Table XMTOUTFL fields
# Col 2:  Target Table XMTOUTFL attribute to populate      - Attribute - Field Name 
# Col 3:  Key Name Reference for Source of the Data that is to be populated into XMTOUTFL
          TSTAMP   - Col 4 contains a Mask for a Time Stamp YYYY-MM-DD:HH:MM:SS.mmmm
          DRCONV   - Col 4 contains a Date field in format DDMMMYY/hhmm [e.g. 28MAR25/1130] and needs to convert to YYYYMMDD.hhmm00 
          INIT     - Col 4 contains an actual value to use  
          DR       - Col 4 contains the 3 char IMF Label of data coming from the 4K DR IMF string eg /BCY = "BCY" 
          PFVAR    - Col 4 contains the label of the attribute containing the entire DR 4K string i.e. DR used to set SY_VARSTR   
          CFG2     - Col 4 data coming from Table XMTCFG2 - XMT_C1KEY in Table XMTCFG1 to get to XMTCFG2 XMT_C2KEY to map to XMTOUTFL SY2_DESTID
          IGNORE   - Ignore this attribute - dont populate 
          PFHDR    - Col 4 Data coming from Table PFWIZREZ Header Section i.e. non-DR
          CONCAT   - Col 4 contains valid Field names and constants to be concatonated - only one currently is OUTFTXD45 
# Col 4:  Contents highly dependent on Col 3 instruction
# Col 5:  Ignore, part of DSPFFD reference from XMTOUTFL  - Attribute - Data Type 
# Col 6:  Ignore, part of DSPFFD reference from XMTOUTFL  - Attribute - Field Length
# Col 7:  Ignore, part of DSPFFD reference from XMTOUTFL  - Attribute - Buffer Length 
# Col 8:  Ignore, part of DSPFFD reference from XMTOUTFL  - Attribute - Buffer Position
# Col 9:  Ignore, part of DSPFFD reference from XMTOUTFL  - Attribute - Field Usage 
# Col 10: Ignore, part of DSPFFD reference from XMTOUTFL  - Attribute - Column Heading (Blank in all these cases)  
#
SECTION-A: MAP-TO-XMTOUTFL
#

#
#  Orientation on how the XML delivered is formulated 
#
#
#  Populating the attributes in XMTOUTFL used by XmtFio to generate XML sections
#  If these tags are not populated (and in the case of "REZHEADER", they are not included in the "IMF.INI" selection Config, 
#  then they will not be populated in the XML output when they are present in the IMF string
# 
#  "BATCHHEADER" section in XML is generated automatically by XmtFio  (BATCHID, BATCHDATE & REZCOUNT)
#
#  "SYSHEADER" section in XML, data must be mapped in "XMTMAPTAG.INI" in order to be available to "SYSHEADER"
# 
#  "REZHEADER" section in XML, data can be mapped in "XMTMAPTAG.INI" and/or "IMF.INI" XmtFio Configuration File
#  Populating these 43 tags here in "XMTMAPTAG.INI" should ensure thast "IMF.INI" need not change immediately on switch-over to SQL Server
#  However, it is recommended that he 43 tags are includded in "IMF.INI" so that, if they are presnet, they will be selected directly from OUT_VARSTR
#  thus being drawn directly from "the single source of truth" as described in SOW2 for cutover to SQL Server  
#  The selection in "IMF.INI" prioritises its selection over that tag in XMTMAPTAG.INI.  
#
#  All other sections in the XML. these are created on demand from the section specified in the "IMF.INI" by XmtFio
#

#
#
#   Sub-Section A of XMTOUTFL  -  WIZCOM Header  (Destined for "SYSHEADER" section in XML)
#
